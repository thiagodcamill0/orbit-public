     Query: ?semrota=1 (GET /projetos → 404: projetos() fica null e a lista antiga aparece) · ?lento=1 · ?recolhida=1 -->
<style>

  @font-face { font-family: 'Geist Mono'; src: url('../assets/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
  /* Subconjunto do index.html (valores finais da cascata), só o que a lateral e a vista usam. */
  :root {
    --fundo: #0a0a0a; --casca: #111111; --t1: #f0f0f0; --t2: #888888; --t3: #5c5c5c; --foco: #70b8ff; --agu: #ffc53d;

    --lat-fundo: #1d1d1d; --lat-hover: #252525; --lat-pilula: #2d2d2d; --lat-fio: rgba(255, 255, 255, .06); --lat-t: #9a9a9a;
    --lat-pilula-sombra: inset 0 1px 0 rgba(255, 255, 255, .06), 0 1px 2px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .25);
    --sup: var(--lat-fundo); --poco: #171717; --poco-sombra: inset 0 1px 2px rgba(0, 0, 0, .35);
    --bloco: #262626; --bloco-2: #2e2e2e; --fio: rgba(255, 255, 255, .06); --fio-2: rgba(255, 255, 255, .085); --fio-3: rgba(255, 255, 255, .13);
    --anel: rgba(112, 184, 255, .7);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--fundo); color: var(--t1); font: 400 13.5px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }

  ::-webkit-scrollbar-track { background: transparent; }
  .btn-icone { width: 32px; height: 32px; flex: none; display: inline-grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--lat-t); padding: 0; }
  .btn-icone:hover { background: var(--lat-hover); color: var(--t1); }

  .casca { position: fixed; inset: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); background: var(--casca); }
  .lateral { display: flex; flex-direction: column; gap: 3px; min-height: 0; overflow-y: auto; padding: 20px 10px 0; background: var(--lat-fundo); border-right: 1px solid var(--lat-fio); }
  .marca { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 10px; font-weight: 600; font-size: 14px; }
  .rot-sec { display: flex; align-items: center; justify-content: space-between; padding: 18px 12px 6px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #5c5c5c; }
  .rot-sec .num { letter-spacing: 0; }
  .nav-item { height: 38px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 10px; background: none; color: var(--lat-t); font-size: 14px; text-align: left; }
  .nav-item:hover { background: var(--lat-hover); color: var(--t1); }
  .projetos { display: flex; flex-direction: column; gap: 1px; }
  .proj-item { position: relative; isolation: isolate; display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 6px 0 10px; min-width: 0;
    border: 0; border-radius: 10px; background: none; color: var(--lat-t); text-align: left; font-size: 13.5px;
    transition: background-color .15s var(--ease-press), color .15s var(--ease-press), transform .16s var(--ease-press); }
  .proj-item::before { content: ''; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none; opacity: 0;
    background: var(--lat-pilula); box-shadow: var(--lat-pilula-sombra); transform: scale(.96); transition: opacity 120ms var(--ease-press), transform 220ms var(--ease-press); }
  .proj-item:hover { background: var(--lat-hover); color: var(--t1); }
  .proj-item:active { transform: scale(.975); }
  .proj-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--lat-fundo), 0 0 0 4px rgba(112, 184, 255, .7); }
  .proj-item[aria-pressed="true"], .proj-item[aria-pressed="true"]:hover { background: transparent; color: #f5f5f5; font-weight: 500; }
  .proj-item[aria-pressed="true"]::before { opacity: 1; transform: none; }
  .proj-item .av { position: relative; width: 22px; height: 22px; flex: none; border-radius: 7px; display: grid; place-items: center; background: #262626; border: 1px solid var(--lat-fio);
    color: var(--lat-t); font-size: 11px; font-weight: 600; transition: background-color .15s ease, color .15s ease; --tag-anel: var(--lat-fundo); }
  .proj-item:hover .av { background: #2e2e2e; color: var(--t1); --tag-anel: var(--lat-hover); }
  .proj-item[aria-pressed="true"] .av { background: #3a3a3a; color: #fff; border-color: rgba(255, 255, 255, .1); --tag-anel: var(--lat-pilula); }
  .pj-tag { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--tag); box-shadow: 0 0 0 2px var(--tag-anel, var(--lat-fundo)); pointer-events: none; }
  .proj-item .nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-item .n { color: #6a6a6a; font-size: 12px; font-variant-numeric: tabular-nums; }
  .proj-item[aria-pressed="true"] .n { color: var(--t2); }
  .proj-item .alerta-p { width: 6px; height: 6px; border-radius: 50%; background: var(--agu); flex: none; }
  .principal { min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; background-color: var(--casca); background-image: radial-gradient(circle, #2a2a2a 1px, transparent 1px); background-size: 24px 24px; }
  .conteudo { max-width: 1180px; margin: 0 auto; padding: 22px 28px 64px; }

  .conteudo p { color: var(--t2); margin: 0 0 12px; }
  #demo-log { font: 11px/1.5 var(--mono); color: #6a6a6a; white-space: pre-wrap; }
  /* ?abas=1: dois painéis lado a lado, como os grupos de assets/abas.js (rolagem própria, contêiner "principal"). */
  body.abas .principal { overflow: hidden; }
  .abas-demo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 100%; }

  @media (min-width: 1100px) {
    body.lat-recolhida .casca { grid-template-columns: 64px minmax(0, 1fr); }
    body.lat-recolhida .rot-sec, body.lat-recolhida .nl, body.lat-recolhida .proj-item .nome, body.lat-recolhida .proj-item .n, body.lat-recolhida .proj-item .alerta-p, body.lat-recolhida .marca b { display: none; }
    body.lat-recolhida .lateral { padding-left: 8px; padding-right: 8px; }
    body.lat-recolhida .nav-item, body.lat-recolhida .proj-item { justify-content: center; padding: 0; }
    body.lat-recolhida .projetos { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--fio); }
  }
  @media (max-width: 1099px) {
    .casca { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .lateral { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 6px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--fio); overflow: visible; }
    .marca { padding: 0; margin-right: auto; }
    .rot-sec, .nav, #recolher { display: none; }
    .projetos { order: 6; flex: 1 1 100%; flex-direction: row; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; padding-right: 28px;
      -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
    .projetos::-webkit-scrollbar { display: none; }
    .proj-item { flex: none; height: 28px; padding: 0 10px 0 4px; border-radius: 8px; font-size: 13px; gap: 8px; border: 1px solid var(--lat-fio); }
    .proj-item .av { width: 20px; height: 20px; border-radius: 6px; }
  }

<script>
(() => {
  const P = new URLSearchParams(location.search);
  const dormir = (ms) => new Promise((r) => setTimeout(r, ms));
  const demo = window.demo = { log: [], lixeira: [], revelados: [], abertas: [], area: '', posts: [] };

  // ── Disco fictício ──
  const raiz = { tipo: 'pasta', filhos: new Map() };
  const partes = (abs) => String(abs).replace(/[\\/]+$/, '').split(/[\\/]+/).filter(Boolean);
  function filho(n, nome) { for (const [k, v] of n.filhos) if (k.toLowerCase() === nome.toLowerCase()) return [k, v]; return null; }
  function no(abs) { let n = raiz; for (const p of partes(abs)) { if (!n || n.tipo !== 'pasta') return null; const f = filho(n, p); if (!f) return null; n = f[1]; } return n; }
  function criar(abs, conteudo, extra) {
    const ps = partes(abs); let n = raiz;
    ps.forEach((p, i) => {
      const f = filho(n, p);
      if (f) { n = f[1]; return; }
      const novo = i === ps.length - 1 && conteudo !== undefined ? { tipo: 'arquivo', conteudo, mtime: Date.now(), ...(extra || {}) } : { tipo: 'pasta', filhos: new Map() };
      n.filhos.set(p, novo); n = novo;
    });
    return n;
  }
  const absDe = (ps) => (ps.length === 1 ? ps[0] + '\\' : ps.join('\\'));
  const G = 'D:\\Dev\\Projetos\\Gerenciador';
  const linhasServidor = ['// Orbit — servidor local', "import http from 'node:http';", "import fs from 'node:fs';", '', 'const PORTA = 47821;', ''];
  for (let i = 0; i < 120; i++) linhasServidor.push(i % 10 === 0 ? 'function rota' + i + '(req, res) {' : i % 10 === 9 ? '}' : '  const valor' + i + ' = calcular(' + i + ', "texto com uma linha bem comprida para testar a quebra de linha e a rolagem horizontal da prévia do arquivo");');
  linhasServidor.push('', 'export default function iniciar() { return http.createServer(); }', '');
  const SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="26" fill="#6366f1"/><path d="M20 34l8 8 16-18" stroke="#fff" stroke-width="5" fill="none"/></svg>';
  const arquivos = {
    [G + '\\.git\\config']: '[core]',
    [G + '\\assets\\arquivos.js']: '// arquivos\nfunction montar() {}\n',
    [G + '\\assets\\arquivos.css']: '.arq-no { height: 23px; }\n',
    [G + '\\assets\\logo.png']: '<png>',
    [G + '\\assets\\icone.svg']: SVG,
    [G + '\\assets\\Geist-Variable.woff2']: '\u0000bin',
    [G + '\\brain\\notas.md']: '# Notas\n\nfunction das notas\n',
    [G + '\\node_modules\\pacote\\index.js']: 'module.exports = function () {};\n',
    [G + '\\testes\\edge.mjs']: 'export async function fecharEdge() {}\n',
    [G + '\\index.html']: '<!doctype html>\n<html lang="pt-BR">\n<head><title>Orbit</title></head>\n<body>\n  <aside class="lateral"></aside>\n</body>\n</html>\n',
    [G + '\\servidor.mjs']: linhasServidor.join('\n'),
    [G + '\\package.json']: '{\n  "name": "gerenciador",\n  "type": "module"\n}\n',
    [G + '\\package-lock.json']: '{}\n',
    [G + '\\README.md']: '# Orbit\n\nPainel local.\n',
    [G + '\\.gitignore']: 'node_modules\n',
    [G + '\\.env']: 'PORTA=47821\n',
    [G + '\\config.json']: '{}\n',
    [G + '\\dados.zip']: '\u0000zip',
    [G + '\\manual.pdf']: '\u0000pdf',
    [G + '\\log.txt']: 'linha 1\nlinha 2\n',
    [G + '\\grande.log']: 'x',
    [G + '\\script.py']: 'def main():\n    print("oi")\n',
    [G + '\\tipos.ts']: 'export type Id = string;\n',
    [G + '\\estilo.css']: 'body { margin: 0; }\n',
    [G + '\\sem-lixeira.txt']: 'a Lixeira desta unidade está desligada\n',
    'D:\\Projetos\\loja-api\\src\\app.js': "import express from 'express';\nfunction app() {}\n",
    'D:\\Projetos\\loja-api\\src\\rotas\\pedidos.js': 'export function pedidos() {}\n',
    'D:\\Projetos\\loja-api\\package.json': '{ "name": "loja-api" }\n',
    'C:\\Users\\usuario\\site-exemplo\\index.html': '<h1>Oi</h1>\n',
  };
  for (const [abs, c] of Object.entries(arquivos)) criar(abs, c, abs.endsWith('grande.log') ? { tamanho: 3 * 1024 * 1024 } : null);
  for (const d of ['C:\\Users\\usuario\\Desktop', 'C:\\Users\\usuario\\Documents', 'C:\\Users\\usuario\\AppData\\Local\\Temp\\claude-x', 'C:\\Windows', 'D:\\Projetos\\nova-ideia', 'D:\\Projetos\\outra', 'D:\\Musicas']) criar(d);
  let projetos = [
    { nome: 'Gerenciador', pasta: G }, { nome: 'loja-api', pasta: 'D:\\Projetos\\loja-api' },
    { nome: 'site-exemplo', pasta: 'C:\\Users\\usuario\\site-exemplo' }, { nome: 'antigo', pasta: 'D:\\Projetos\\antigo' },
  ];
  const col = new Intl.Collator('pt-BR', { sensitivity: 'base', numeric: true });
  const listaProj = () => projetos.map((p) => ({ ...p, existe: !!no(p.pasta) })).sort((a, b) => col.compare(a.nome, b.nome));

  // ── SSE falso (a mesma ponte do index.html: api.on) ──
  const ouvintes = {};
  function emitir(tipo, d) { for (const fn of ouvintes[tipo] || []) { try { fn(d); } catch (e) { console.warn(e); } } }
  const api = Object.freeze({ on: (tipo, fn) => { (ouvintes[tipo] = ouvintes[tipo] || new Set()).add(fn); return () => ouvintes[tipo].delete(fn); } });
  window.GerenciadorAPI = api;
  const mudou = (projeto, pastas, arqs) => setTimeout(() => emitir('arquivos', { projeto, pastas: [...new Set(pastas)], arquivos: [...new Set(arqs)] }), 300);
  demo.emitir = emitir;
  demo.no = (abs) => { const n = no(abs); return n ? { tipo: n.tipo, conteudo: n.conteudo, filhos: n.filhos ? [...n.filhos.keys()] : null } : null; };
  demo.escrever = (projeto, caminho, conteudo) => { const p = projetos.find((x) => x.nome === projeto); const n = criar(p.pasta + '\\' + caminho.replace(/\//g, '\\'), conteudo); n.conteudo = conteudo; n.mtime = Date.now(); mudou(projeto, [caminho.includes('/') ? caminho.slice(0, caminho.lastIndexOf('/')) : ''], [caminho]); };

  // ── Rotas (rodada 8) ──
  const ESCONDIDOS = ['.git', '.svn', '.hg', 'cvs', '.ds_store', 'thumbs.db'];
  const IMG = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico', 'svg'];
  const PNG = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
  const ext = (n) => (n.includes('.') ? n.slice(n.lastIndexOf('.') + 1).toLowerCase() : '');
  const json = (status, d) => new Response(JSON.stringify(d), { status, headers: { 'content-type': 'application/json' } });
  const erro = (status, texto, motivo) => json(status, motivo ? { erro: texto, motivo } : { erro: texto });
  function nomeInvalido(n) {
    return typeof n !== 'string' || !n || /[<>:"/\\|?*\u0000-\u001f]/.test(n) || /[. ]$/.test(n) || /^(con|prn|aux|nul|com[1-9]|lpt[1-9])(\..*)?$/i.test(n);
  }
  function resolver(projeto, caminho) {
    const p = projetos.find((x) => x.nome === projeto);
    if (!p) return { r: erro(404, 'Esse projeto não está na lista.') };
    caminho = String(caminho || '');
    if (/(^|\/)\.\.(\/|$)/.test(caminho) || /^[\\/]|^[a-z]:/i.test(caminho) || caminho.includes('\\')) return { r: erro(403, 'Fora da pasta do projeto.') };
    return { p, abs: caminho ? p.pasta + '\\' + caminho.replace(/\//g, '\\') : p.pasta, caminho };
  }
  const paiC = (c) => (c.includes('/') ? c.slice(0, c.lastIndexOf('/')) : '');
  const baseC = (c) => c.slice(c.lastIndexOf('/') + 1);
  const juntarC = (a, b) => (a ? a + '/' + b : b);
  const clonar = (n) => (n.tipo === 'pasta' ? { tipo: 'pasta', filhos: new Map([...n.filhos].map(([k, v]) => [k, clonar(v)])) } : { ...n });
  function nomeCopia(pasta, nome) {
    if (!filho(pasta, nome)) return nome;
    const i = nome.lastIndexOf('.'); const b = i > 0 ? nome.slice(0, i) : nome, e = i > 0 ? nome.slice(i) : '';
    for (let k = 1; ; k++) { const n = b + ' copy' + (k > 1 ? ' ' + k : '') + e; if (!filho(pasta, n)) return n; }
  }
  async function servidor(url, init) {
    await dormir(P.get('lento') ? 400 : 15);
    const u = new URL(url, location.origin);
    const rota = u.pathname, q = u.searchParams;
    const post = init && init.method === 'POST';
    let corpo = {};
    if (post) {
      if (!init.headers || init.headers['x-gerenciador'] !== '1') return erro(403, 'Falta o cabeçalho x-gerenciador.');
      try { corpo = JSON.parse(init.body || '{}'); } catch { return erro(400, 'JSON inválido.'); }
      demo.posts.push([rota, corpo]);
    }
    // Temas do VS Code: sem tema de ícones nem realce na demonstração (o módulo fica com os SVG próprios e o texto puro).
    if (rota === '/temas/icones') return json(200, { ok: false });
    if (rota === '/arquivos/realce') return json(200, { realce: null });
    if (rota === '/projetos' && !post) return P.get('semrota') ? erro(404, 'não encontrado') : json(200, { projetos: listaProj() });
    if (rota === '/projetos/adicionar') {
      const pasta = String(corpo.pasta || '').replace(/[\\/]+$/, '');
      if (/\\AppData\\Local\\Temp(\\|$)/i.test(pasta)) return erro(400, 'Pastas temporárias não entram como projeto.', 'temporaria');
      const n = no(pasta);
      if (!n || n.tipo !== 'pasta') return erro(404, 'Essa pasta não existe: ' + pasta);
      const ps = partes(pasta), nome = ps[ps.length - 1];
      const ja = projetos.find((p) => p.pasta.toLowerCase() === pasta.toLowerCase());
      if (ja) return json(200, { ok: true, projeto: ja, projetos: listaProj() });
      if (projetos.some((p) => p.nome.toLowerCase() === nome.toLowerCase())) return erro(409, 'Já existe um projeto chamado ' + nome + '.', 'nome');
      const novo = { nome, pasta: absDe(ps) };
      projetos.push(novo);
      setTimeout(() => emitir('projetos', { projetos: listaProj() }), 50);
      return json(201, { ok: true, projeto: novo, projetos: listaProj() });
    }
    if (rota === '/projetos/remover') {
      projetos = projetos.filter((p) => p.nome !== corpo.nome);
      setTimeout(() => emitir('projetos', { projetos: listaProj() }), 50);
      return json(200, { ok: true, projetos: listaProj() });
    }
    if (rota === '/arquivos/pastas') {
      const c = q.get('caminho');

<script>
  // Como o montarArquivos() do index.html: montar, vista, mostrar o "+" e desenhar.

  (() => {
    const demo = window.demo, A = window.Arquivos, g = window.__demo_ganchos;

      document.body.classList.add('abas');
      document.querySelector('.conteudo').hidden = true;
